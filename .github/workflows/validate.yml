name: Validate

on:
  pull_request:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static-only records and tooling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docs]"

      - name: Run unit tests
        run: python -m pytest

      - name: Validate catalog, audit and policy records
        run: python -m patchguard.cli --root . validate

      - name: Build documentation
        run: python -m mkdocs build --strict

      - name: Reject generated or binary changes in pull requests
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed-files.txt
          echo "Changed files:"
          cat changed-files.txt

          if grep -Eq '^(patches-list\.json|patches-bundle\.json|PATCHES\.md|CHANGELOG\.md)$' changed-files.txt; then
            echo "::error::Do not edit generated files in a pull request. Release workflow owns them."
            exit 1
          fi

          if grep -Eqi '\.(apk|apkm|xapk|dex|so|jar)$' changed-files.txt; then
            echo "::error::APK, DEX, native library and jar files are not allowed in this repository."
            exit 1
          fi

          if grep -Eq '(^|/)morphe-signing\.key$|(^|/)\.env($|\.)|(^|/)secrets?\.' changed-files.txt; then
            echo "::error::Secret-like files must never be committed."
            exit 1
          fi
