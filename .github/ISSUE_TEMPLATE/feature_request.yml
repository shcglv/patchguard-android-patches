name: Feature or tooling request
description: Suggest a documentation, tooling, schema, or workflow improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        # Feature or tooling request

        PatchGuard is intentionally static-only. Requests to add APK analysis, emulator testing, or runtime verification will be declined because they conflict with the project's security model.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem should this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the change. Explain how it remains static-only.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else did you consider?

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: This request does not add APK, DEX, emulator, or runtime testing requirements.
          required: true
        - label: I have searched existing issues for duplicates.
          required: true
