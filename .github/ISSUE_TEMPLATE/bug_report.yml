name: PatchGuard patch bug
description: Report a problem with a PatchGuard patch or its documentation.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        # PatchGuard patch bug

        PatchGuard does not runtime-test patches and does not support APK installation. Reports that require running a target app are outside the project's model.

        For security issues, use private vulnerability reporting instead of this form.

  - type: input
    id: patch
    attributes:
      label: Patch or page
      description: Patch slug, file, or documentation page.
      placeholder: com.example.app/remove-ads
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: PatchGuard version or commit
      description: Release tag or commit SHA.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong? Include exact file paths and quotations where useful.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What should happen instead?

  - type: textarea
    id: evidence
    attributes:
      label: Static evidence
      description: Logs, schema errors, build output, or documentation links. Do not attach APKs or secrets.

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: I have not attached an APK, DEX file, native library, or secret.
          required: true
        - label: This report does not require runtime testing of a target application.
          required: true
        - label: I have searched existing issues for duplicates.
          required: true
